# Keep pinned actions and dependencies updated (course step 15)
version: 2
updates:
  - package-ecosystem: "github-actions"   # bumps the SHA pins + "# vX.Y.Z" comments
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7                     # let new releases age a week (supply-chain safety)
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"              # bumps requirements*.txt
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7                     # let new releases age a week (supply-chain safety)
    groups:
      python:
        patterns: ["*"]
