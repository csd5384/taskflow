# Release pipeline (CD): every merge to main runs CI (full matrix), which builds and
# tests the image. This workflow then publishes THAT tested image and deploys it:
# staging automatically, production after approval. Nothing is rebuilt.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]   # docs-only merges don't redeploy
  workflow_dispatch:

permissions: {}                          # every job declares exactly what it needs

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read                     # a called workflow can't get more than this
    with:
      full-matrix: true
      upload-image: true                 # hand the tested image to the publish job

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write                    # the ONLY job that pushes new images
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Download the image CI tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Push it to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPO,,}"
          docker load --input taskflow-image.tar
          docker tag taskflow:ci "$IMAGE:$SHA"
          docker tag taskflow:ci "$IMAGE:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$SHA")
          echo "image=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          { echo "### Image published"; echo "\`$DIGEST_REF\`"; } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false          # never interrupt a deploy; queue instead
    permissions:
      contents: read                     # checkout, to use the local composite actions
      packages: write                    # move the :staging tag (no new images)
    env:
      HAS_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - name: No deploy target configured
        if: env.HAS_HOOK != 'true'
        run: echo "::warning::RENDER_DEPLOY_HOOK is not set for 'staging'. Skipping the real deploy."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_HOOK == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-render
        if: env.HAS_HOOK == 'true'
        with:
          deploy-hook: ${{ secrets.RENDER_DEPLOY_HOOK }}
          image: ${{ needs.publish.outputs.image }}
          app-url: ${{ vars.APP_URL }}
          expected-version: ${{ github.sha }}
      - uses: ./.github/actions/tag-image  # only after the smoke test passed
        if: env.HAS_HOOK == 'true'
        with:
          image: ${{ needs.publish.outputs.image }}
          tag: staging
          token: ${{ github.token }}

  deploy-production:
    needs: [publish, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production                   # required reviewer + main-only rule (Settings)
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write                    # move the :production tag (no new images)
    env:
      HAS_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - name: No deploy target configured
        if: env.HAS_HOOK != 'true'
        run: echo "::warning::RENDER_DEPLOY_HOOK is not set for 'production'. Skipping the real deploy."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_HOOK == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-render
        if: env.HAS_HOOK == 'true'
        with:
          deploy-hook: ${{ secrets.RENDER_DEPLOY_HOOK }}
          image: ${{ needs.publish.outputs.image }}       # the SAME image staging got
          app-url: ${{ vars.APP_URL }}
          expected-version: ${{ github.sha }}
      - uses: ./.github/actions/tag-image  # only after the smoke test passed
        if: env.HAS_HOOK == 'true'
        with:
          image: ${{ needs.publish.outputs.image }}
          tag: production
          token: ${{ github.token }}
