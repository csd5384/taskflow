# Lab 2.3 — Job orchestration (course step 9)
# Copy to: .github/workflows/ci.yml  (replaces the Lab 2.1 version)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch/PR: a newer push cancels the older, now-useless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quick-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:                                       # job output = step output, declared here
      short_sha: ${{ steps.info.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - id: info
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        if: success() || failure()
        run: mypy

  test:
    needs: quick-checks                            # cheap checks first
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  report:
    needs: [quick-checks, test]
    if: always()                                   # report even when something failed
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Summarize the run
        env:
          SHORT_SHA: ${{ needs.quick-checks.outputs.short_sha }}
          QUICK: ${{ needs.quick-checks.result }}
          TEST: ${{ needs.test.result }}
        run: |
          {
            echo "### Taskflow CI for \`${SHORT_SHA:-?}\`"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| quick-checks | $QUICK |"
            echo "| test | $TEST |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    needs: [quick-checks, test]
    if: failure()                                  # only when an upstream job failed
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          BRANCH: ${{ github.ref_name }}
        run: echo "::error::CI failed on $BRANCH (this is where a Slack/email alert would go)"
