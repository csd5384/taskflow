# Reusable workflow = CI: the ONE definition of "is this change OK?".
# Checks the code, then builds the container image and tests the image itself.
# Called by ci.yml (PRs), nightly.yml (schedule) and release.yml (before publishing).
name: Checks

on:
  workflow_call:
    inputs:
      full-matrix:
        description: Test on Windows too (nightly and releases)
        type: boolean
        default: false
      upload-image:
        description: Upload the tested image as the "image" artifact (release publishes it)
        type: boolean
        default: false
    outputs:
      short-sha:
        description: Short commit SHA that was checked
        value: ${{ jobs.quick-checks.outputs.short_sha }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quick-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      short_sha: ${{ steps.info.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project      # composite action
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
      - name: Restore mypy cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'pyproject.toml', 'app/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-
      - id: info
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Lint
        run: ruff check .
      - name: Type check
        if: success() || failure()
        run: mypy

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install actionlint-py==1.7.12.25 zizmor==1.30.1
      - name: actionlint (correctness)
        run: actionlint
      - name: zizmor (security)
        if: success() || failure()     # report even if actionlint already failed
        run: zizmor --offline --min-severity medium .github

  test:
    needs: quick-checks
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full-matrix && '["ubuntu-24.04", "windows-2025"]' || '["ubuntu-24.04"]') }}
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ matrix.python }}
      - name: Test with coverage
        run: pytest -v --cov --cov-report=html --cov-report=xml --cov-report=json --junitxml=junit.xml
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
            htmlcov/
          retention-days: 7
      - name: Prepare coverage data for the PR comment
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr-coverage
          cp coverage.json pr-coverage/
          echo "$PR_NUMBER" > pr-coverage/pr_number.txt
      - name: Upload coverage data for the PR comment
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-coverage
          path: pr-coverage/
          retention-days: 3

  image:
    # Build the deployable artifact and test the artifact itself, not just the code.
    # release.yml publishes exactly this tested image; it is never rebuilt.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag taskflow:ci .
      - name: Test the container
        run: bash scripts/test-image.sh taskflow:ci "$GITHUB_SHA"
      - name: Save image
        run: docker save taskflow:ci --output taskflow-image.tar
      - name: Scan for fixable HIGH/CRITICAL vulnerabilities (Trivy)
        run: |
          docker run --rm -v "$PWD:/work:ro" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /work/taskflow-image.tar --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress
      - name: Upload image for release
        if: inputs.upload-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: taskflow-image.tar
          retention-days: 1

  ci-passed:
    needs: [quick-checks, workflow-lint, test, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All checks succeeded?
        env:
          SHORT_SHA: ${{ needs.quick-checks.outputs.short_sha }}
          QUICK: ${{ needs.quick-checks.result }}
          WFLINT: ${{ needs.workflow-lint.result }}
          TEST: ${{ needs.test.result }}
          IMAGE: ${{ needs.image.result }}
          FULL: ${{ inputs.full-matrix }}
        run: |
          {
            echo "### Taskflow checks for \`${SHORT_SHA:-?}\` (full matrix: $FULL)"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| quick-checks | $QUICK |"
            echo "| workflow-lint | $WFLINT |"
            echo "| test (all combinations) | $TEST |"
            echo "| image (build + test + scan) | $IMAGE |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$QUICK" = "success" && test "$WFLINT" = "success" && test "$TEST" = "success" \
            && test "$IMAGE" = "success"
