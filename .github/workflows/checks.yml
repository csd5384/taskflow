# Lab 4.1 — Reusable workflow (course step 16)
# Copy to: .github/workflows/checks.yml
#: the ONE definition of "is this code OK?".
# Called by ci.yml (PRs), nightly.yml (schedule) and release.yml (before deploying).
name: Checks

on:
  workflow_call:
    inputs:
      full-matrix:
        description: Test on Windows too (nightly and releases)
        type: boolean
        default: false
    outputs:
      short-sha:
        description: Short commit SHA that was checked
        value: ${{ jobs.quick-checks.outputs.short_sha }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quick-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      short_sha: ${{ steps.info.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Restore mypy cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'pyproject.toml', 'app/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-
      - id: info
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Lint
        run: ruff check .
      - name: Type check
        if: success() || failure()
        run: mypy

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install actionlint-py==1.7.12.25 zizmor==1.30.1
      - name: actionlint (correctness)
        run: actionlint
      - name: zizmor (security)
        if: success() || failure()     # report even if actionlint already failed
        run: zizmor --offline --min-severity medium .github

  test:
    needs: quick-checks
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full-matrix && '["ubuntu-24.04", "windows-2025"]' || '["ubuntu-24.04"]') }}
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test with coverage
        run: pytest -v --cov --cov-report=html --cov-report=xml --cov-report=json --junitxml=junit.xml
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
            htmlcov/
          retention-days: 7
      - name: Prepare coverage data for the PR comment
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr-coverage
          cp coverage.json pr-coverage/
          echo "$PR_NUMBER" > pr-coverage/pr_number.txt
      - name: Upload coverage data for the PR comment
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-coverage
          path: pr-coverage/
          retention-days: 3

  ci-passed:
    needs: [quick-checks, workflow-lint, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All checks succeeded?
        env:
          SHORT_SHA: ${{ needs.quick-checks.outputs.short_sha }}
          QUICK: ${{ needs.quick-checks.result }}
          WFLINT: ${{ needs.workflow-lint.result }}
          TEST: ${{ needs.test.result }}
          FULL: ${{ inputs.full-matrix }}
        run: |
          {
            echo "### Taskflow checks for \`${SHORT_SHA:-?}\` (full matrix: $FULL)"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| quick-checks | $QUICK |"
            echo "| workflow-lint | $WFLINT |"
            echo "| test (all combinations) | $TEST |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$QUICK" = "success" && test "$WFLINT" = "success" && test "$TEST" = "success"
