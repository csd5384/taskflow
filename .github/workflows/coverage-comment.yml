# Safe PR comments, even on fork PRs (split privilege)
#
# CI ran the PR's (possibly untrusted) code with NO secrets and a read-only token,
# and uploaded coverage numbers as an artifact. This workflow has a write token
# but NEVER checks out or runs PR code: it treats the artifact as untrusted DATA.
name: Coverage comment

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] -- privileged by design; never runs PR code (see header)
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read                      # download the artifact from the CI run
      pull-requests: write               # post the comment
    steps:
      # Deliberately NO actions/checkout in this job.
      - name: Download coverage data from the CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-coverage
          path: pr-coverage/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate the untrusted data
        id: data
        run: |
          PR=$(head -c 20 pr-coverage/pr_number.txt | tr -d '[:space:]')
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number in artifact"; exit 1
          fi
          PCT=$(jq -r '.totals.percent_covered_display // empty' pr-coverage/coverage.json)
          if ! [[ "$PCT" =~ ^[0-9]{1,3}$ ]]; then
            echo "::error::Invalid coverage value in artifact"; exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Check the PR really belongs to this CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.data.outputs.pr }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$PR_SHA" != "$RUN_SHA" ]; then
            echo "::error::PR #$PR head ($PR_SHA) does not match the CI run ($RUN_SHA)"; exit 1
          fi

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.data.outputs.pr }}
          PCT: ${{ steps.data.outputs.pct }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr comment "$PR" --body "Coverage for ${RUN_SHA:0:7}: **${PCT}%** (posted by the coverage-comment workflow)"
