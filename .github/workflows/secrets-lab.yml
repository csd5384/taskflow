# Lab 2.2 — Secrets (course step 8)
# Copy to: .github/workflows/secrets-lab.yml
# Use a FAKE value for DEMO_SECRET: this lab deliberately shows how masking can be bypassed.
name: Secrets lab

on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-24.04
    env:
      # secrets can't be used directly in if:, so map "is it set?" to an env var
      HAS_DEMO_SECRET: ${{ secrets.DEMO_SECRET != '' }}
    steps:
      - name: Skip cleanly when the secret is missing
        if: env.HAS_DEMO_SECRET != 'true'
        run: echo "::warning::DEMO_SECRET is not set. Create it first (Lab 2.2, step 1)."

      - name: Masking hides the exact value
        if: env.HAS_DEMO_SECRET == 'true'
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}       # scoped to this one step
        run: |
          echo "Direct value: $DEMO_SECRET"
          echo "Length:       ${#DEMO_SECRET}"

      - name: Transformed values are NOT masked
        if: env.HAS_DEMO_SECRET == 'true'
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Base64:   $(printf %s "$DEMO_SECRET" | base64)"
          echo "Reversed: $(printf %s "$DEMO_SECRET" | rev)"

      - name: Not referenced means not available
        run: |
          echo "DEMO_SECRET in this step: ${DEMO_SECRET:-<not set>}"
