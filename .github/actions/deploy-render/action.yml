# Composite action (course step 17): one deploy procedure for every environment.
name: Deploy to Render
description: Deploy an exact image to a Render service and wait until /health reports the expected version

inputs:
  deploy-hook:
    description: Render deploy hook URL (pass from an environment secret)
    required: true
  image:
    description: Immutable image reference, e.g. ghcr.io/owner/repo@sha256:...
    required: true
  app-url:
    description: Public base URL of the service
    required: true
  expected-version:
    description: Version /health must report (the commit SHA)
    required: true
  timeout-seconds:
    description: How long to wait for the new version
    default: "600"

runs:
  using: composite
  steps:
    - name: Trigger deploy
      shell: bash
      env:                               # inputs go through env, never spliced into the script
        HOOK: ${{ inputs.deploy-hook }}
        IMAGE: ${{ inputs.image }}
      run: |
        ENCODED=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE"], safe=""))')
        curl --fail --silent --show-error -X POST "${HOOK}&imgURL=${ENCODED}" > /dev/null
        echo "Deploy triggered for $IMAGE"

    - name: Smoke test (wait until the new version is live)
      shell: bash
      env:
        APP_URL: ${{ inputs.app-url }}
        EXPECTED: ${{ inputs.expected-version }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
      run: |
        DEADLINE=$(( $(date +%s) + TIMEOUT ))
        ATTEMPT=0
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          ATTEMPT=$((ATTEMPT + 1))
          VERSION=$(curl -fsS --max-time 10 "$APP_URL/health" | python3 -c 'import sys, json; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
          echo "Attempt $ATTEMPT: live version = ${VERSION:-unreachable}"
          if [ "$VERSION" = "$EXPECTED" ]; then
            echo "New version is live at $APP_URL"
            exit 0
          fi
          sleep 15
        done
        echo "::error::Version $EXPECTED did not go live within ${TIMEOUT}s"
        exit 1
