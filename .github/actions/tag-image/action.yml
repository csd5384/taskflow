# Composite action: record in the registry which image an environment runs.
# Moves a tag (e.g. :staging, :production) to an exact digest; nothing is pulled or rebuilt.
name: Tag image
description: Point an environment tag in GHCR at an exact image digest and verify it

inputs:
  image:
    description: Immutable image reference, e.g. ghcr.io/owner/repo@sha256:...
    required: true
  tag:
    description: Tag to move to that image, e.g. production
    required: true
  token:
    description: Token with packages:write (pass github.token)
    required: true

runs:
  using: composite
  steps:
    - name: Move the tag and verify it
      shell: bash
      env:                               # inputs go through env, never spliced into the script
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        TOKEN: ${{ inputs.token }}
        ACTOR: ${{ github.actor }}
      run: |
        # Re-upload the image's manifest, byte for byte, under the new tag, via the
        # registry API. Same bytes = same digest. (docker buildx imagetools create
        # would wrap it in a new manifest list with a different digest.)
        REPO="${IMAGE%@*}"
        DIGEST="${IMAGE#*@}"
        NAME="${REPO#ghcr.io/}"
        API="https://ghcr.io/v2/$NAME/manifests"
        ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json"
        ACCEPT="$ACCEPT,application/vnd.docker.distribution.manifest.list.v2+json"
        ACCEPT="$ACCEPT,application/vnd.docker.distribution.manifest.v2+json"
        MANIFEST=$(mktemp)

        BEARER=$(curl -fsS -u "$ACTOR:$TOKEN" \
          "https://ghcr.io/token?service=ghcr.io&scope=repository:$NAME:pull,push" | jq -r .token)
        echo "::add-mask::$BEARER"

        TYPE=$(curl -fsS -H "Authorization: Bearer $BEARER" -H "Accept: $ACCEPT" \
          -o "$MANIFEST" -w '%{content_type}' "$API/$DIGEST")
        curl -fsS -X PUT -H "Authorization: Bearer $BEARER" -H "Content-Type: $TYPE" \
          --data-binary "@$MANIFEST" "$API/$TAG" > /dev/null

        ACTUAL=$(curl -fsS -I -H "Authorization: Bearer $BEARER" -H "Accept: $ACCEPT" "$API/$TAG" \
          | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')
        if [ "$ACTUAL" != "$DIGEST" ]; then
          echo "::error::$REPO:$TAG points to $ACTUAL, expected $DIGEST"; exit 1
        fi
        echo "$REPO:$TAG -> $DIGEST"
        { echo "### \`:$TAG\` now points to"; echo "\`$IMAGE\`"; } >> "$GITHUB_STEP_SUMMARY"
