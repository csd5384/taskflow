<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskflow</title>
  <style>
    :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --accent:#60a5fa; } }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width:560px; margin:48px auto; padding:0 16px; }
    h1 { font-size:28px; margin:0 0 4px; }
    .version { color:var(--muted); font-size:13px; margin:0 0 24px; }
    form { display:flex; gap:8px; margin-bottom:16px; }
    input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
    button { padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
    li span { flex:1; }
    li.done span { text-decoration:line-through; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Taskflow</h1>
  <p class="version" id="version">version: loading…</p>
  <form id="add">
    <input type="text" id="title" placeholder="Write the release notes" required maxlength="200">
    <button class="primary" type="submit">Add</button>
  </form>
  <ul id="list"></ul>
</main>
<script>
  const list = document.getElementById('list');
  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    return res.status === 204 ? null : res.json();
  }
  async function render() {
    const todos = await api('/api/todos');
    list.replaceChildren(...todos.map(t => {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      const box = document.createElement('input');
      box.type = 'checkbox'; box.checked = t.done;
      box.onchange = async () => { await api(`/api/todos/${t.id}`, { method: 'PATCH', body: JSON.stringify({ done: box.checked }) }); render(); };
      const span = document.createElement('span'); span.textContent = t.title;
      const del = document.createElement('button'); del.textContent = 'Delete';
      del.onclick = async () => { await api(`/api/todos/${t.id}`, { method: 'DELETE' }); render(); };
      li.append(box, span, del);
      return li;
    }));
  }
  document.getElementById('add').onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('title');
    await api('/api/todos', { method: 'POST', body: JSON.stringify({ title: input.value }) });
    input.value = ''; render();
  };
  api('/health').then(h => { document.getElementById('version').textContent = `version: ${h.version}`; });
  render();
</script>
</body>
</html>
