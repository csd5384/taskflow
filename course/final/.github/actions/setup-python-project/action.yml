# Composite action (course step 17): replaces the same 2 setup steps in every job.
# Requires actions/checkout to have run first (this file lives in the repo).
name: Set up Python project
description: Install Python with pip caching and install the project's dev dependencies

inputs:
  python-version:
    description: Python version to install
    default: "3.12"

outputs:
  python-version:
    description: The exact Python version that was installed
    value: ${{ steps.py.outputs.python-version }}

runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev dependencies
      shell: bash                        # composite run steps MUST declare a shell
      run: python -m pip install -r requirements-dev.txt
