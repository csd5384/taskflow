# PR pipeline: fast checks on every pull request (small matrix).
# Required status check in the main ruleset: "checks / ci-passed".
name: CI

on:
  pull_request:          # no paths-ignore here: a required check must always report
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true             # a newer push to the PR cancels the older run

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      full-matrix: false
