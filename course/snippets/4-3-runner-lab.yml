# Lab 4.3 — Self-hosted runners (course step 18)
# Copy to: .github/workflows/runner-lab.yml in a SEPARATE, PRIVATE scratch repo.
# NEVER attach a self-hosted runner on your own PC to the public taskflow repo.
name: Runner lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  where-am-i:
    runs-on: [self-hosted, windows]      # labels your runner got when you configured it
    timeout-minutes: 5
    steps:
      - name: Which machine is this, and what did earlier jobs leave behind?
        shell: powershell                # Windows PowerShell 5.1, present on every Windows PC
        run: |
          Write-Output "Machine: $env:COMPUTERNAME   User: $env:USERNAME"
          Write-Output "Workspace: $env:GITHUB_WORKSPACE"
          $marker = Join-Path $env:TEMP "runner-lab-marker.txt"
          if (Test-Path $marker) {
            Write-Output "LEFTOVER FROM AN EARLIER JOB: $(Get-Content $marker)"
          } else {
            Write-Output "No leftovers: this machine looks clean"
          }
          "written by run $env:GITHUB_RUN_ID at $(Get-Date -Format o)" | Out-File $marker
          Write-Output "Left a marker file at $marker for the next job to find"
