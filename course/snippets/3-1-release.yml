# Lab 3.1 — Build once, publish an image (bridge into Part 3)
# Copy to: .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}                         # nothing by default; each job asks for what it needs

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read                    # checkout
      packages: write                   # push to GitHub Container Registry (GHCR)
    outputs:
      image: ${{ steps.push.outputs.image }}     # immutable reference: image@sha256:...
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and push image to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPO,,}"                 # GHCR names must be lowercase
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --build-arg APP_VERSION="$SHA" -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$SHA")
          echo "image=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          {
            echo "### Image published"
            echo "\`$DIGEST_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
