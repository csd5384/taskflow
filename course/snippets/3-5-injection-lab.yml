# Lab 3.5 — See script injection happen, then fix it (course steps 7 + 15)
# Copy to: .github/workflows/injection-lab.yml
# DELETE this file when you finish the lab. It is intentionally vulnerable.
name: Injection lab

on:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    # Only for PRs from branches in THIS repo, never from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: VULNERABLE - expression pasted into the script
        run: echo "Branch is ${{ github.head_ref }}"

      - name: SAFE - value passed as data through env
        env:
          BRANCH: ${{ github.head_ref }}
        run: echo "Branch is $BRANCH"
